<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小苏 · 今日考点</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0a0e27 100%);
  color: #fff; min-height: 100vh; padding: 20px;
}
.container { max-width: 600px; margin: 0 auto; }
.header {
  text-align: center; margin-bottom: 20px; padding: 18px;
  background: rgba(0, 255, 136, 0.08);
  border: 1px solid #00ff88; border-radius: 12px;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
}
.countdown {
  font-size: 32px; font-weight: bold; color: #00ff88;
  text-shadow: 0 0 12px #00ff88;
  font-variant-numeric: tabular-nums;
}
.countdown-label { font-size: 13px; color: #aaa; margin-top: 5px; letter-spacing: 2px; }
.card {
  background: linear-gradient(135deg, #1e1e3f 0%, #2a2a4f 100%);
  border: 2px solid #00ff88; border-radius: 16px;
  padding: 22px; margin-bottom: 16px;
  box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
  animation: fadeIn 0.5s ease-in;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.badge {
  display: inline-block; padding: 4px 12px;
  background: #00ff88; color: #0a0e27;
  border-radius: 12px; font-size: 12px; font-weight: bold;
}
.badge.必考 { background: #ff006e; color: #fff; box-shadow: 0 0 8px #ff006e; }
.freq { font-size: 12px; color: #888; }
.chapter { font-size: 13px; color: #aaa; margin-bottom: 8px; }
.title {
  font-size: 22px; font-weight: bold; color: #fff;
  margin-bottom: 14px; line-height: 1.3;
}
.key {
  background: rgba(0, 255, 136, 0.1);
  border-left: 3px solid #00ff88;
  padding: 10px 14px; margin-bottom: 8px;
  font-size: 14px; line-height: 1.6; border-radius: 4px;
}
.tip {
  font-size: 14px; color: #ffd700;
  padding: 10px 14px; background: rgba(255, 215, 0, 0.08);
  border-radius: 8px; margin-top: 10px;
  border: 1px dashed rgba(255, 215, 0, 0.3);
}
.dots { text-align: center; margin-top: 16px; }
.dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: #444;
  margin: 0 4px; transition: all 0.3s; cursor: pointer;
}
.dot.active {
  background: #00ff88; box-shadow: 0 0 10px #00ff88; transform: scale(1.3);
}
.footer {
  text-align: center; margin-top: 18px;
  font-size: 12px; color: #555; letter-spacing: 1px;
}
.error {
  background: rgba(255, 0, 110, 0.1);
  border: 1px solid #ff006e; padding: 20px; border-radius: 12px;
  color: #ff006e; text-align: center;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="countdown" id="countdown">--</div>
    <div class="countdown-label">距 2027 年高考</div>
  </div>
  <div id="card-container">
    <div class="card"><div class="title">加载中...</div></div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="footer">🧬 小苏 · 今日考点速记 · 4秒自动切换</div>
</div>

<script>
const API_URL = 'https://balla-mcp-server.onrender.com/exam_point_card';
let currentIndex = 0, points = [], timer = null;

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const json = await res.json();
    if (json.code === 200 && json.data.points.length > 0) {
      document.getElementById('countdown').textContent = json.data.countdown_days + ' 天';
      points = json.data.points;
      renderCard(0);
      renderDots();
      timer = setInterval(next, 4000);
    } else {
      showError('数据格式异常');
    }
  } catch (e) {
    showError('加载失败:请检查 MCP 服务');
  }
}

function showError(msg) {
  document.getElementById('card-container').innerHTML = 
    `<div class="error"><div style="font-size:18px;margin-bottom:8px;">⚠️ ${msg}</div>
     <div style="font-size:12px;color:#aaa;">API: ${API_URL}</div></div>`;
}

function next() {
  currentIndex = (currentIndex + 1) % points.length;
  renderCard(currentIndex);
  updateDots();
}

function renderCard(i) {
  const p = points[i];
  document.getElementById('card-container').innerHTML = `
    <div class="card">
      <div class="card-header">
        <span class="badge ${p.type}">${p.type}</span>
        <span class="freq">${p.frequency}</span>
      </div>
      <div class="chapter">${p.chapter}</div>
      <div class="title">${p.title}</div>
      <div class="key"><strong>核心:</strong> ${p.key_concept}</div>
      <div class="key"><strong>要点:</strong> ${p.key_reaction}</div>
      <div class="tip">💡 ${p.tip}</div>
    </div>`;
}

function renderDots() {
  document.getElementById('dots').innerHTML = points.map((_, i) =>
    `<span class="dot ${i === 0 ? 'active' : ''}" data-i="${i}"></span>`
  ).join('');
  document.querySelectorAll('.dot').forEach(d => {
    d.onclick = () => {
      currentIndex = parseInt(d.dataset.i);
      renderCard(currentIndex);
      updateDots();
      clearInterval(timer);
      timer = setInterval(next, 4000);
    };
  });
}

function updateDots() {
  document.querySelectorAll('.dot').forEach((d, i) =>
    d.classList.toggle('active', i === currentIndex)
  );
}

loadData();
</script>
</body>
</html>
